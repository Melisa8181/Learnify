    <style>
      .login-body {
        background-color: #fd7e14;
      }
      form {
        max-width: 400px;
        margin: 0 auto;
      }

  <body>
    <main class="login-body">
      <!-- Login Admin -->
      <form id="loginForm">
        <div class="login-form">
          <h2>Inicia Sesión</h2>
          <div class="form-input">
            <label for="dni">DNI:</label>
            <input type="text" id="dni" required />
            <label for="contrasenia">Contraseña:</label>
            <input type="password" id="contrasenia" required />
            <input type="submit" value="Iniciar Sesión" />
          </div>

          <!-- Forget Password -->
          <a href="#" class="forget">Olvidé contraseña</a>
          <!-- Forget Password -->
          <a href="{{ url_for('register') }}" class="registration"
            >Registrarme</a
          >
        </div>
      </form>
      <!-- /end login form -->
    </main>
    <!-- JS here -->
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Evitar que se envíe el formulario automáticamente

          var dniInput = document.getElementById("dni").value;
          var contraseniaInput = document.getElementById("contrasenia").value;
          var url =
            "https://registro-43a85-default-rtdb.firebaseio.com/registro.json";

          // Realizar la petición GET a la API para obtener los registros
          fetch(url)
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              var registroEncontrado = false;
              var registroId;

              // Buscar el registro que coincida con el DNI y la contraseña ingresados
              for (var key in data) {
                if (
                  data.hasOwnProperty(key) &&
                  data[key].dni === dniInput &&
                  data[key].contrasenia === contraseniaInput
                ) {
                  registroEncontrado = true;
                  registroId = key;
                  break;
                }
              }

              if (registroEncontrado) {
                // Redirigir a alumnos.html con el ID del registro como parámetro en la URL
                window.location.href =
                  "/alumnos?id=" + encodeURIComponent(registroId);
              } else {
                alert("Credenciales inválidas. Por favor, intenta nuevamente.");
              }
            })
            .catch(function (error) {
              alert("Ha ocurrido un error. Por favor, intenta nuevamente.");
              console.error(error);
            });
        });
    </script>
