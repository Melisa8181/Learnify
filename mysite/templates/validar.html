<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Learnify | Education</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-iYQeCzEYFbKjA/T2uDLTpkwGzCiq6soy8tYaI1GyVh/UjpbCx/TYkiZhlZB6+fzT"
      crossorigin="anonymous"
    />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="manifest" href="site.webmanifest" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="../static/img/favicon.ico"
    />

    <link rel="stylesheet" href="../static/css/bootstrap.min.css" />
    <link rel="stylesheet" href="../static/css/owl.carousel.min.css" />
    <link rel="stylesheet" href="../static/css/slicknav.css" />
    <link rel="stylesheet" href="../static/css/flaticon.css" />
    <link rel="stylesheet" href="../static/css/progressbar_barfiller.css" />
    <link rel="stylesheet" href="../static/css/gijgo.css" />
    <link rel="stylesheet" href="../static/css/animate.min.css" />
    <link rel="stylesheet" href="../static/css/animated-headline.css" />
    <link rel="stylesheet" href="../static/css/magnific-popup.css" />
    <link rel="stylesheet" href="../static/css/fontawesome-all.min.css" />
    <link rel="stylesheet" href="../static/css/themify-icons.css" />
    <link rel="stylesheet" href="../static/css/slick.css" />
    <link rel="stylesheet" href="../static/css/nice-select.css" />
    <link rel="stylesheet" href="../static/css/style.css" />

    <style>
      .login-body {
        background-color: #fd7e14;
      }
      form {
        max-width: 400px;
        margin: 0 auto;
      }
      label,
      input {
        display: block;
        margin-bottom: 10px;
      }
      input[type="submit"] {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main class="login-body">
      <!-- Login Admin -->
      <form id="registroForm">
        <div class="login-form">
          <h2>Valide su Identidad</h2>
          <div class="form-input">
            <label for="dni">Ingrese su DNI:</label>
            <input type="text" id="dni" required />
            <input type="submit" name="submit" value="Verificar" />
          </div>
        </div>
      </form>
      <!-- /end login form -->
    </main>
    <!-- JS here -->
    <script>
      document
        .getElementById("registroForm")
        .addEventListener("submit", function (event) {
          event.preventDefault(); // Evitar que se envíe el formulario automáticamente

          var dniInput = document.getElementById("dni").value;
          var url =
            "https://registro-43a85-default-rtdb.firebaseio.com/registro.json";
          // Realizar la petición GET a la API para verificar el DNI
          fetch(url)
            .then(function (response) {
              return response.json();
            })
            .then(function (data) {
              // Verificar si el DNI existe en algún registro
              var dniExiste = false;
              for (var key in data) {
                if (data.hasOwnProperty(key) && data[key].dni === dniInput) {
                  dniExiste = true;
                  break;
                }
              }

              if (dniExiste) {
                alert("El número de DNI ya existe en un registro.");
                // Redirigir al usuario a login.html
                window.location.href = "/login";
              } else {
                // Habilitar el formulario de carga de datos
                document.getElementById("registroForm").innerHTML = `
                
                <main class="login-body">
                <form>
                <div class="login-form">
                <h2>Formulario de Registro</h2>
                <div>
                <label for="nombreyapellido">Nombre y Apellido:</label>
                <input type="text" id="nombreyapellido" required>
                <label for="mail">Email:</label>
                <input type="email" id="mail" required>
                <label for="curso">Curso:</label>
                <select id="curso" required>
                  <option value="Front End Developer">Front End Developer</option>
                  <option value="Marketing">Marketing</option>
                  <option value="Diseño Grafico">Diseño Gráfico</option>
                  <option value="Fundamentos de la danza">Fundamentos de la Danza Contemporánea</option>
                  <option value="Carrera">Preparación a la Carrera</option>
                </select>
                <label for="contrasenia">Contraseña:</label>
                <input type="password" id="contrasenia" required>
                <input type="submit" value="Registrar">
                </div>
                </div>
                </form>
                </main>
                
              `;

                // Agregar el evento de envío del formulario de registro
                document
                  .getElementById("registroForm")
                  .addEventListener("submit", function (event) {
                    event.preventDefault(); // Evitar que se envíe el formulario automáticamente

                    var datos = {
                      dni: dniInput,
                      nombreyapellido:
                        document.getElementById("nombreyapellido").value,
                      mail: document.getElementById("mail").value,
                      curso: document.getElementById("curso").value,
                      contrasenia: document.getElementById("contrasenia").value,
                    };

                    // Realizar la petición POST a la API para guardar los datos de registro
                    fetch(url, {
                      method: "POST",
                      body: JSON.stringify(datos),
                    })
                      .then(function (response) {
                        alert("Registro exitoso!");
                        // Restablecer el formulario
                        document.getElementById("registroForm").reset();

                        // Redirigir al usuario a login.html
                        window.location.href = "/login";
                      })
                      .catch(function (error) {
                        alert(
                          "Ha ocurrido un error. Por favor, intenta nuevamente."
                        );
                        console.error(error);
                      });
                  });
              }
            })
            .catch(function (error) {
              alert("Ha ocurrido un error. Por favor, intenta nuevamente.");
              console.error(error);
            });
        });
    </script>
  </body>
</html>
